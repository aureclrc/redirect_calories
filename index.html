<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening App...</title>
    <style>
        body {
            background-color: #0b0f17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #10b981;
            color: #000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 9999px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <p>Redirection vers votre application...</p>
    <a id="manual-link" class="btn" href="#">Ouvrir manuellement</a>

    <script>
        // 1. Extraction du paramètre "url" ou renvoi direct des paramètres de requête
        const params = new URLSearchParams(window.location.search);
        let target = params.get('url');

        // Si on a passé les paramètres directement sans "url=", on reconstruit mycalories://log?...
        if (!target) {
            target = 'mycalories://log' + window.location.search;
        }

        const manualLink = document.getElementById('manual-link');
        manualLink.href = target;

        // 2. Déclenchement automatique de la redirection
        window.location.replace(target);
    </script>
</body>

</html>
